name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Engram is built from source on the machine that runs it, so "does it build here"
    # is the only portability question there is — there is no release artifact to test
    # instead. macOS is the development platform; Linux and Windows are supported
    # targets and stay unproven unless CI actually builds them.
    strategy:
      # Every platform reports. A Windows failure must not hide whether Linux passed,
      # because the two fail for unrelated reasons and both need fixing on their own.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            exe: engram
            vecext: vec0.dylib
          - os: ubuntu-latest
            rid: linux-x64
            exe: engram
            vecext: vec0.so
          - os: windows-latest
            rid: win-x64
            exe: engram.exe
            vecext: vec0.dll

    runs-on: ${{ matrix.os }}

    # A green job finishes in minutes; the default cap is six hours, and a private
    # repo bills a hung Windows job double for the whole gap — measured at seven
    # runs deep in one night. The blame-hang flags below name the wedged test;
    # this bounds what not knowing costs.
    timeout-minutes: 30

    defaults:
      run:
        # One shell everywhere, so the steps below are not three dialects of the same
        # script. Windows runners provide bash via Git for Windows.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Native AOT shells out to a C toolchain and a linker. They are present on the
      # macOS and Windows images already; on Linux the ILCompiler needs these two by
      # name and fails at link time without them.
      - name: Install AOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The vector tests are environment-gated, so without this they skip — and a guard
      # that never runs is worth nothing. Fetching it into the same home the smoke test
      # uses means `engram init` below also exercises the real extension-load path
      # rather than only the absent-extension one.
      - name: Fetch sqlite-vec
        run: scripts/fetch-vec0.sh --home "$PWD/ci-home"

      - name: Build
        run: dotnet build -c Release

      # A test that blocks forever otherwise reports nothing: the job dies at the
      # runner's cap with an unflushed log, and the only fact recorded is that it
      # hung somewhere. --blame-hang aborts the wedged test and prints its name,
      # which is the difference between a verdict and a mystery. No dump — the
      # name is the diagnostic, and nothing uploads artifacts to keep one.
      - name: Test
        run: dotnet test -c Release --no-build --blame-hang --blame-hang-timeout 8m --blame-hang-dump-type none
        env:
          ENGRAM_VEC_EXTENSION: ${{ github.workspace }}/ci-home/lib/${{ matrix.vecext }}

      # 'home' only prints paths, so it exits 0 on an AOT image that cannot open a
      # database at all — which is the failure mode AOT actually produces, since the
      # SQLite P/Invoke is resolved at runtime rather than linked in. The smoke test
      # has to do the thing that loads it.
      - name: AOT publish smoke test
        run: |
          dotnet publish src/Engram.Cli -c Release -r ${{ matrix.rid }} -o ci-out
          ENGRAM_HOME="$PWD/ci-home" ./ci-out/${{ matrix.exe }} init

      - name: End-to-end tests
        run: dotnet test tests/Engram.EndToEnd.Tests -c Release --blame-hang --blame-hang-timeout 8m --blame-hang-dump-type none
        env:
          ENGRAM_TEST_BINARY: ${{ github.workspace }}/ci-out/${{ matrix.exe }}
