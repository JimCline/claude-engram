name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # 'home' only prints paths, so it exits 0 on an AOT image that cannot open a
      # database at all — which is the failure mode AOT actually produces, since the
      # SQLite P/Invoke is resolved at runtime rather than linked in. The smoke test
      # has to do the thing that loads it.
      - name: AOT publish smoke test
        run: |
          dotnet publish src/Engram.Cli -c Release -r osx-arm64 -o ci-out
          ENGRAM_HOME="$(mktemp -d)" ./ci-out/engram init

      - name: End-to-end tests
        run: dotnet test tests/Engram.EndToEnd.Tests -c Release
        env:
          ENGRAM_TEST_BINARY: ${{ github.workspace }}/ci-out/engram
